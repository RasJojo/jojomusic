services:
  jojomusic-tor:
    image: dperson/torproxy
    container_name: jojomusic-tor
    restart: unless-stopped
    networks:
      - internal

  youtube-cookie-refresher:
    image: jojomusic-youtube-cookie-refresher:latest
    container_name: jojomusic-youtube-cookie-refresher
    restart: unless-stopped
    environment:
      YOUTUBE_COOKIE_BROWSER: firefox
      YOUTUBE_COOKIE_PROFILE: /browser-profile/.config/mozilla/firefox
      YOUTUBE_COOKIE_OUTPUT: /cookies/cookies.txt
      YOUTUBE_COOKIE_STATUS: /cookies/cookies.status.json
      YOUTUBE_COOKIE_REFRESH_INTERVAL_SECONDS: 21600
      YOUTUBE_COOKIE_VALIDATE_URL: https://www.youtube.com/watch?v=d27gTrPPAyk
      YOUTUBE_POT_PROVIDER_URL: http://youtube-pot-provider:4416
    volumes:
      - ./cookie_state:/cookies
      - youtube_cookie_browser:/browser-profile:ro
    networks:
      - internal
    depends_on:
      youtube-pot-provider:
        condition: service_started

  youtube-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: jojomusic-youtube-pot-provider
    restart: unless-stopped
    init: true
    networks:
      - internal

  youtube-cookie-browser:
    image: lscr.io/linuxserver/firefox:latest
    container_name: jojomusic-youtube-cookie-browser
    profiles:
      - cookie-login
    restart: unless-stopped
    shm_size: "1gb"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Europe/Paris
    volumes:
      - youtube_cookie_browser:/config
    ports:
      - "127.0.0.1:3010:3000"
      - "127.0.0.1:3011:3001"

  resolver-api:
    image: jojomusic-resolver:latest
    container_name: jojomusic-resolver
    restart: unless-stopped
    environment:
      RESOLVER_TIMEOUT_SECONDS: 8
      PIPED_INSTANCES: ""
      TOR_PROXY: socks5://jojomusic-tor:9050
      YOUTUBE_POT_PROVIDER_URL: http://youtube-pot-provider:4416
    depends_on:
      jojomusic-tor:
        condition: service_started
      youtube-pot-provider:
        condition: service_started
    volumes:
      - ./cookie_state/cookies.txt:/app/cookies.txt:ro
    networks:
      - internal

  media-worker:
    image: jojomusic-worker:latest
    container_name: jojomusic-worker
    restart: unless-stopped
    environment:
      CONVEX_URL: https://convex.jojoserv.com
      CONVEX_ADMIN_KEY: convex-self-hosted|0109ec82a1c77dc4ed33ecc93393d6ae855c5b4cd66e3ed4f14fb68755964e38efa7723782
      MEDIA_CACHE_DIR: /data/audio_cache
      IMAGE_CACHE_DIR: /data/image_cache
      POLL_INTERVAL_SECONDS: 3
      AUDIO_JOB_TIMEOUT_SECONDS: 90
      TOR_PROXY: socks5://jojomusic-tor:9050
      YOUTUBE_POT_PROVIDER_URL: http://youtube-pot-provider:4416
    depends_on:
      jojomusic-tor:
        condition: service_started
      youtube-pot-provider:
        condition: service_started
    volumes:
      - audio_cache:/data/audio_cache
      - image_cache:/data/image_cache
      - ./cookie_state/cookies.txt:/app/cookies.txt:ro
    networks:
      - internal

  jojomusic-media:
    image: nginx:alpine
    container_name: jojomusic-media
    restart: unless-stopped
    volumes:
      - ./services/media_nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - audio_cache:/data/audio_cache:ro
      - image_cache:/data/image_cache:ro
    networks:
      - caddy

volumes:
  audio_cache:
  image_cache:
  youtube_cookie_browser:

networks:
  internal:
    driver: bridge
  caddy:
    external: true
