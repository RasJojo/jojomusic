worker_processes auto;
events { worker_connections 1024; }

http {
  sendfile on;
  keepalive_timeout 65;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 80;
    server_name _;

    location = /health {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location ~ ^/api/v1/media/audio/(.+)$ {
      alias /data/audio_cache/$1.m4a;
      types { }
      default_type audio/mp4;
      add_header Cache-Control "public, max-age=86400";
    }

    location ~ ^/api/v1/media/image/([a-f0-9]+)$ {
      root /data;
      try_files
        /image_cache/$1.jpg
        /image_cache/$1.jpeg
        /image_cache/$1.png
        /image_cache/$1.webp
        /image_cache/$1.gif
        /image_cache/$1.avif
        =404;
      add_header Cache-Control "public, max-age=86400";
    }

    location / {
      return 404;
    }
  }
}
